services:
  climateclaw-base:
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: ghcr.io/freva-org/climateclaw-base:latest
    profiles:
      - build-only

  climateclaw:
    image: climateclaw-${CLIMATECLAW_INSTANCE_NAME:?Instance name must be set in the .env file to differentiate between instances}
    build:
      context: .
      dockerfile: docker/climateclaw/Dockerfile
    env_file: .env
    environment:
      CLIMATECLAW_DEV: ${CLIMATECLAW_DEV}
      CLIMATECLAW_DEBUG: ${CLIMATECLAW_DEBUG:-0}
    hostname: climateclaw-${CLIMATECLAW_INSTANCE_NAME}
    ports:
      - "${CLIMATECLAW_TARGET_PORT:-8502}:${CLIMATECLAW_BACKEND_PORT:-8502}" # If either is unset, the default value will be used.
      - "8600:${CLIMATECLAW_BACKEND_PORT:-8502}" # localhost:8600/docs give FastAPI docs
      - "${CLIMATECLAW_DEBUG_PORT:-5678}:${CLIMATECLAW_DEBUG_PORT:-5678}" # Port for debugpy
    volumes:
      - ./cache/:/app/cache
      - ./logs/:/app/logs
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${CLIMATECLAW_BACKEND_PORT:-8502}/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      litellm:
        condition: service_healthy

  rag-server:
    image: rag-server-${CLIMATECLAW_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/rag-server/Dockerfile
    env_file: .env
    hostname: rag-server-${CLIMATECLAW_INSTANCE_NAME}
    environment:
      CLIMATECLAW_DEV: ${CLIMATECLAW_DEV}
      CLIMATECLAW_DEBUG: ${CLIMATECLAW_DEBUG:-0}
      CLIMATECLAW_MCP_HOST: 0.0.0.0
      CLIMATECLAW_MCP_PORT: ${CLIMATECLAW_RAG_PORT:-8050}
    volumes:
      - ./resources:/app/resources:ro
      - ./logs/:/app/logs
    networks:
      - climateclaw

  code-server:
    image: code-server-${CLIMATECLAW_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/code-server/Dockerfile
    env_file: .env
    hostname: code-server-${CLIMATECLAW_INSTANCE_NAME}
    environment:
      CLIMATECLAW_DEV: ${CLIMATECLAW_DEV}
      CLIMATECLAW_DEBUG: ${CLIMATECLAW_DEBUG:-0}
      CLIMATECLAW_MCP_HOST: 0.0.0.0
      CLIMATECLAW_MCP_PORT: ${CLIMATECLAW_CODE_PORT:-8051}
    ports:
      - 8051:8051
    cpus: 4
    volumes:
      - ./cache/:/app/cache
      - ./logs/:/app/logs
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web-search-server:
    image: web-search-server-${CLIMATECLAW_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/web-search-server/Dockerfile
    env_file: .env
    hostname: web-search-server-${CLIMATECLAW_INSTANCE_NAME}
    environment:
      CLIMATECLAW_DEV: ${CLIMATECLAW_DEV}
      CLIMATECLAW_DEBUG: ${CLIMATECLAW_DEBUG:-0}
      CLIMATECLAW_MCP_HOST: 0.0.0.0
      CLIMATECLAW_MCP_PORT: 8052
    ports:
      - 8052:8052
    networks:
      - climateclaw
    volumes:
      - ./logs/:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8052/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    hostname: litellm-${CLIMATECLAW_INSTANCE_NAME}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml # Mount the local litellm_config.yaml file to the container
      - ./logs/:/app/logs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        litellm
        --config=/app/config.yaml
        --port=4000
        --num_workers=8
        --run_gunicorn
        --detailed_debug
        2>&1 | tee -a /app/logs/litellm.log
    env_file: .env
    ports:
      - "4000:4000" # Expose LiteLLM port to the host machine for direct access if needed, e.g. local dev
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    hostname: ollama-${CLIMATECLAW_INSTANCE_NAME}
    networks:
      - climateclaw

  mongodb:
    networks:
      - climateclaw
    image: ghcr.io/freva-org/freva-mongo:latest
    environment:
      - API_MONGO_USER=${CLIMATECLAW_MONGODB_USER:?MongoDB user and password must be set in the .env file. See .env.example.}
      - API_MONGO_PASSWORD=${CLIMATECLAW_MONGODB_PASSWORD}
      - API_MONGO_DB=${CLIMATECLAW_MONGODB_DATABASE_NAME}
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    healthcheck:
      test: ["CMD", "healthchecks", "-s", "mongo"]
      interval: 35s
      timeout: 2s
      retries: 3
      start_period: 15s

  freva-db:
    networks:
      - climateclaw
    hostname: freva-db
    container_name: freva-db
    image: ghcr.io/freva-org/freva-mysql:9.3.0
    environment:
      - ROOT_PW=T3st
      - HOST=localhost
      - PROJECT=freva-dev
      - MYSQL_USER=freva
      - MYSQL_PASSWORD=T3st
      - MYSQL_DATABASE=frevadb
      - MYSQL_ROOT_PASSWORD=test_password_please_ignore
    ports:
      - "3306:3306"

  freva-web:
    networks:
      - climateclaw
    image: ghcr.io/freva-org/freva-web:latest
    ports:
      - "8000:8000"
    container_name: freva-web
    hostname: freva-web
    environment:
      - EVALUATION_SYSTEM_CONFIG_FILE=/data/evaluation_system.conf
      - DJANGO_SUPERUSER_PASSWORD=T3st
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - SCHEDULER_HOST=localhost
      - REDIS_HOST=freva-cache
      - CSRF_TRUSTED_ORIGINS=http://127.0.0.1,http://localhost
      - FREVA_REST_URL=http://restapi:7777
      - CHAT_BOT_URL=http://climateclaw:8502
      - ACTIVATE_CHAT_BOT=1
      - STAC_BROWSER=1
      - DEV_MODE=1
      - CHAT_BOT=1
    volumes:
      - ./docker/freva.conf:/data/evaluation_system.conf
      - ./cache/:/opt/freva_web/static/preview/climateclaw

  freva-cache:
    networks:
      - climateclaw
    image: ghcr.io/freva-org/freva-redis:latest
    hostname: freva-cache
    container_name: freva-cache

  volume-prep:
    image: docker.io/python:3-alpine
    user: 0:0
    hostname: volume-prep
    restart: "no"
    command:  find /settings -mindepth 1 -maxdepth 1 -exec rm -rf {} +
    volumes:
      - settings-data:/settings:rw

  git-prep:
    image: docker.io/alpine/git
    user: 0:0
    hostname: git-prep
    restart: "no"
    depends_on:
      volume-prep:
        condition: service_completed_successfully
    command: ["clone", "--depth", "1", "https://github.com/freva-org/freva-service-config.git", "/settings"]
    volumes:
      - settings-data:/settings:rw

  prep:
    image: docker.io/python:3-alpine
    user: 0:0
    hostname: prep
    restart: "no"
    depends_on:
      git-prep:
        condition: service_completed_successfully
    command: >
        sh -eu -c '
          ls -rlt /settings &&
          python /settings/dev-utils.py gen-certs --cert-dir /certs &&
          cp -a /settings/keycloak/import/. /import/
        '
    volumes:
      - settings-data:/settings:ro
      - certs-data:/certs:rw
      - import-data:/import:rw

  solr:
    networks:
      - climateclaw
    image: ghcr.io/freva-org/freva-solr:latest
    ports:
      - "8983:8983"
    hostname: solr
    healthcheck:
      test: ["CMD", "healthchecks", "-s", "solr"]
      interval: 35s
      timeout: 2s
      retries: 3
      start_period: 15s

  keycloak:
    networks:
      climateclaw:
        aliases:
          - keycloak.localhost
    image: quay.io/keycloak/keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_PASSWORD: secret
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      prep:
        condition: service_completed_successfully
    hostname: keycloak
    volumes:
      - certs-data:/certs:ro
      - import-data:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    command: |
         start-dev
         --hostname-strict=false
         --hostname=http://keycloak.localhost:8080
         --import-realm
         -Dkeycloak.migration.strategy=OVERWRITE_EXISTING

  keycloak-bootstrap:
    image: docker.io/alpine
    restart: "no"
    depends_on:
      - keycloak
    environment:
      USER: ${USER}
      KEYCLOAK_ADMIN: keycloak
      KEYCLOAK_ADMIN_PASSWORD: secret
      KEYCLOAK_HOST: keycloak:8080
    command: >
      /bin/sh -c '
        set -eu &&
        apk add --no-cache curl jq ca-certificates &&
        curl -fsSL \
          "https://raw.githubusercontent.com/freva-org/freva-nextgen/refs/heads/main/dev-env/create-user.sh"\
          -o create_user.sh &&
        sh create_user.sh || true
      '
    networks:
      - climateclaw

  freva-rest-server:
    user: root
    image: ghcr.io/freva-org/freva-rest-api:2607.0.0
    hostname: restapi
    networks:
      - climateclaw
    environment:
      - API_SOLR_CORE=files
      - API_PORT=7777
      - COLUMNS=140
      - API_OIDC_CLIENT_ID=freva
      - API_OIDC_DISCOVERY_URL=http://keycloak.localhost:8080/realms/freva/.well-known/openid-configuration
      - API_OIDC_TOKEN_CLAIMS=admin
      - API_ADMIN_CLAIMS=${USER}
      - API_OIDC_SYSTEMUSER_CLAIM=preferred_username
      - API_OIDC_TRUSTED_ISSUERS=https://www.freva.dkrz.de
      - API_REDIS_USER=redis
      - API_REDIS_PASSWORD=secret
      - API_REDIS_HOST=redis://freva-cache:6379
      - API_LOGDIR=/tmp/logs
      - API_SOLR_HOST=http://solr:8983
      - API_MONGO_USER=${CLIMATECLAW_MONGODB_USER}
      - API_MONGO_HOST=mongodb:27017
      - API_MONGO_PASSWORD=${CLIMATECLAW_MONGODB_PASSWORD}
      - API_MONGO_DB=search_stats
      - API_SERVICES=databrowser,stacapi
    depends_on:
      solr:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    ports:
      - 7777:7777
    command: ["--redis-ssl-certdir", "/certs"]
    volumes:
      - certs-data:/certs:ro

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - climateclaw

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus


networks:
  climateclaw:
    driver: bridge


volumes:
  settings-data:
  certs-data:
  import-data:
