services:

  climateclaw-base:
    # Build manually with:
    # docker compose -f docker-compose.dev.yml --profile build-only build climateclaw-base
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    image: ghcr.io/freva-org/climateclaw-base:latest
    profiles:
      - build-only

  climateclaw:
    image: climateclaw-${CLIMATECLAW_INSTANCE_NAME:?Instance name must be set in the .env file to differentiate between instances}
    build:
      context: .
      dockerfile: docker/climateclaw/Dockerfile
    env_file: .env
    hostname: climateclaw-${CLIMATECLAW_INSTANCE_NAME}
    ports:
      - "${CLIMATECLAW_TARGET_PORT:-8502}:${CLIMATECLAW_BACKEND_PORT:-8502}" # If either is unset, the default value will be used.
    volumes:
      - /work:/work:ro
      - /pool/data:/pool/data:ro
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/logs:/app/logs
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${CLIMATECLAW_BACKEND_PORT:-8502}/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      litellm:
        condition: service_healthy

  code-server:
    image: code-server-${CLIMATECLAW_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/code-server/Dockerfile
    env_file: .env
    hostname: code-server-${CLIMATECLAW_INSTANCE_NAME}
    environment:
      CLIMATECLAW_MCP_HOST: 0.0.0.0
      CLIMATECLAW_MCP_PORT: 8051
    volumes:
      - /work:/work:ro
      - /pool/data:/pool/data:ro
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/logs:/app/logs
    cpus: 4
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8051/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web-search-server:
    image: web-search-server-${CLIMATECLAW_INSTANCE_NAME}
    build:
      context: .
      dockerfile: docker/web-search-server/Dockerfile
    env_file: .env
    hostname: web-search-server-${CLIMATECLAW_INSTANCE_NAME}
    environment:
      CLIMATECLAW_MCP_HOST: 0.0.0.0
      CLIMATECLAW_MCP_PORT: 8052
    networks:
      - climateclaw
    volumes:
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8052/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    hostname: litellm-${CLIMATECLAW_INSTANCE_NAME}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml # Mount the local litellm_config.yaml file to the container
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/logs:/app/logs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        litellm
        --config=/app/config.yaml
        --port=4000
        --num_workers=8
        --run_gunicorn
        --detailed_debug
        2>&1 | tee -a /app/logs/litellm.log
    logging:
      driver: syslog
      options:
        syslog-address: "${CLIMATECLAW_SYSLOG_ADDRESS:?Set CLIMATECLAW_SYSLOG_ADDRESS}"
        tag: "litellm-${CLIMATECLAW_INSTANCE_NAME}"
    env_file: .env
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama: # Ollama is only for the backend and not accessible from the outside. Port 11434 is not exposed.
    image: ollama/ollama:latest
    hostname: ollama-${CLIMATECLAW_INSTANCE_NAME}
    volumes:
      - /container/da/climateclaw-ollama-models/.ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${CLIMATECLAW_OLLAMA_KEEP_ALIVE:--1}
    networks:
      - climateclaw
    devices:
      - nvidia.com/gpu=all

  mongodb:
    user: 0:0
    image: ghcr.io/freva-org/freva-mongo:latest
    hostname: mongodb-${CLIMATECLAW_INSTANCE_NAME}
    environment:
      - API_MONGO_USER=${CLIMATECLAW_MONGODB_USER:?MongoDB user and password must be set in the .env file. See .env.example.}
      - API_MONGO_PASSWORD=${CLIMATECLAW_MONGODB_PASSWORD}
      - API_MONGO_DB=${CLIMATECLAW_MONGODB_DATABASE_NAME}
    ports:
      - 27017:27017
    volumes:
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/mongo-data:/data/db:z
      - /container/da/climateclaw-links/${CLIMATECLAW_INSTANCE_NAME}/mongo-logs:/data/logs:z
    networks:
      - climateclaw
    healthcheck:
      test: ["CMD", "healthchecks", "-s", "mongo"]
      interval: 35s
      timeout: 2s
      retries: 3
      start_period: 15s


networks:
  climateclaw:
    driver: bridge
