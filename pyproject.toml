[build-system]
requires = ["flit_core >=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "climateclaw"
version = "0.1.0"
description = "An LLM chatbot API integrated to Freva."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "DKRZ, Data Analysis", email = "freva@dkrz.de" }]
license = { text = "GNU Affero GPLv3" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero GPLv3",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13"
]
dependencies = [
    "anyio",
    "fastapi",
    "fastmcp==3.4.2",
    "mcp==1.28.1",
    "httpx",
    "ipython",
    "langchain-community>=0.3.31",
    "litellm>=1.76.2",
    "motor",
    "platformdirs",
    "python-dotenv",
    "pyyaml",
    "respx",
    "rich-argparse",
    "rich",
    "uvicorn[standard]",
    "debugpy",
    "toml",
    "jq",
    "ansi2html",
    "psutil",
    "pip>=26.1.2",
    "pre-commit>=4.6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "ruff>=0.11.8",
    "mypy>=1.15.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]
test = [
    "jupyter-client>=8.8.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]
type = [
    "mypy>=1.15.0",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
    "types-toml",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E203",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-vv --cov=climateclaw --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
  "integration: tests that require docker-compose services",
]

[tool.mypy]
files = ["src/climateclaw"]
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
pretty = true

disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = false
no_implicit_optional = false

[tool.coverage.report]
ignore_errors = false
exclude_lines = [
    "pragma: no cover",
    "noqa",
    "def __call__",
    "def __repr__",
    "if self\\.debug",
    "def _post_url\\(self\\)",
    "raise AssertionError",
    "raise NotImplementedError",
    "except KeyboardInterrupt:",
    "except ImportError:",
    "except RuntimeError",
    "raise SystemExit",
    "except OSError:",
    "except Exception as error:",
    "except errors.BulkWriteError as bwe:",
    "except Exception:",
    "class Completer",
    "if 0:",
    "if perf_file *:",
    "p_col = *",
    "f_col = *",
    "q_col = *",
    "if __name__ == .__main__.:",
]
